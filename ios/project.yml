# The Xcode project of the iOS apps, for XcodeGen: `xcodegen generate` writes Almucantar.xcodeproj.
# The apps use the Swift package of the core at the root of the repository; build its
# xcframework first (python3 core/apple/build_xcframework.py).
#
# The shared code is in Shared/. Each app compiles these files into its own target, so the shared
# code needs no public access levels. The framework AlmucantarShared builds Shared/ alone: it checks
# that the shared code does not depend on an app, and AlmucantarSharedTests tests it.
name: Almucantar
options:
  bundleIdPrefix: at.stefl
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Almucantar:
    path: ..
targets:
  AlmucantarShared:
    type: framework
    platform: iOS
    sources: [Shared]
    dependencies:
      - package: Almucantar
        product: Almucantar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: at.stefl.almucantar.shared
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets: [AlmucantarSharedTests]
  AlmucantarSharedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SharedTests
      # BaseMapTests read the base map from the test bundle.
      - path: ../assets/basemap/basemap.json
        buildPhase: resources
    dependencies:
      - target: AlmucantarShared
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.0"

  SunradarApp:
    type: application
    platform: iOS
    sources:
      - Shared
      - path: Sunradar
        excludes: [CHANGELOG.md]
      # The offline base map (Natural Earth). The app reads it from the bundle; see assets/basemap/README.md.
      - path: ../assets/basemap/basemap.json
        buildPhase: resources
    dependencies:
      - package: Almucantar
        product: Almucantar
    settings:
      base:
        PRODUCT_NAME: Sunradar
        PRODUCT_MODULE_NAME: SunradarApp
        PRODUCT_BUNDLE_IDENTIFIER: at.stefl.sunradar
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [AlmucantarSharedTests]
    info:
      path: Sunradar/Info.plist
      properties:
        CFBundleDisplayName: Sunradar
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Sunradar shows the path of the sun on the camera image.
        NSLocationWhenInUseUsageDescription: Sunradar needs your place to calculate the position of the sun.
        NSMotionUsageDescription: Sunradar uses the motion sensors to know where the phone points.
  StarradarApp:
    type: application
    platform: iOS
    sources:
      - Shared
      - path: Starradar
        excludes: [CHANGELOG.md]
      - path: ../assets/basemap/basemap.json
        buildPhase: resources
      # The star data (PLAN.md 14.2), the same file as in the Android app and the web app.
      - path: ../assets/stars/stars.json
        buildPhase: resources
    dependencies:
      - package: Almucantar
        product: Almucantar
    settings:
      base:
        PRODUCT_NAME: Starradar
        PRODUCT_MODULE_NAME: StarradarApp
        PRODUCT_BUNDLE_IDENTIFIER: at.stefl.starradar
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [StarradarTests]
    info:
      path: Starradar/Info.plist
      properties:
        CFBundleDisplayName: Starradar
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Starradar shows the stars on the camera image.
        NSLocationWhenInUseUsageDescription: Starradar needs your place to calculate the positions of the stars.
        NSMotionUsageDescription: Starradar uses the motion sensors to know where the phone points.
  # The tests of the data of starradar. They run in the app, because the app owns the code.
  StarradarTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - StarradarTests
      - path: ../assets/stars/stars.json
        buildPhase: resources
    dependencies:
      - target: StarradarApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Starradar.app/Starradar"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # The store screenshots: a UI test that starts the app in its demo mode (screenshots/README.md).
  SunradarUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SunradarUITests]
    dependencies:
      - target: SunradarApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: SunradarApp
        SWIFT_VERSION: "5.0"
schemes:
  # fastlane snapshot runs this scheme. The tests run in Debug, because only a debug build has the
  # demo mode.
  Sunradar Screenshots:
    build:
      targets:
        SunradarApp: all
        SunradarUITests: [test]
    test:
      config: Debug
      targets: [SunradarUITests]
