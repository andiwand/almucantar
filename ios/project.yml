# The Xcode project of the iOS apps, for XcodeGen: `xcodegen generate` writes Almucantar.xcodeproj.
# The apps use the Swift package of the core at the root of the repository; build its
# xcframework first (python3 core/apple/build_xcframework.py).
#
# The shared code is in Shared/. Each app compiles these files into its own target, so the shared
# code needs no public access levels. The framework AlmucantarShared builds Shared/ alone: it checks
# that the shared code does not depend on an app, and AlmucantarSharedTests tests it.
name: Almucantar
options:
  bundleIdPrefix: at.stefl
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Almucantar:
    path: ..
targets:
  AlmucantarShared:
    type: framework
    platform: iOS
    sources: [Shared]
    dependencies:
      - package: Almucantar
        product: Almucantar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: at.stefl.almucantar.shared
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets: [AlmucantarSharedTests]
  AlmucantarSharedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SharedTests
      # BaseMapTests read the base map from the test bundle.
      - path: ../assets/basemap/basemap.json
        buildPhase: resources
    dependencies:
      - target: AlmucantarShared
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.0"

  SonnseiteApp:
    type: application
    platform: iOS
    sources:
      - Shared
      - path: Sonnseite
        excludes: [CHANGELOG.md]
      # The offline base map (Natural Earth). The app reads it from the bundle; see assets/basemap/README.md.
      - path: ../assets/basemap/basemap.json
        buildPhase: resources
    dependencies:
      - package: Almucantar
        product: Almucantar
    settings:
      base:
        PRODUCT_NAME: Sonnseite
        PRODUCT_MODULE_NAME: SonnseiteApp
        PRODUCT_BUNDLE_IDENTIFIER: at.stefl.sonnseite
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [AlmucantarSharedTests]
    info:
      path: Sonnseite/Info.plist
      properties:
        CFBundleDisplayName: Sonnseite
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Sonnseite shows the path of the sun on the camera image.
        NSLocationWhenInUseUsageDescription: Sonnseite needs your place to calculate the position of the sun.
        NSMotionUsageDescription: Sonnseite uses the motion sensors to know where the phone points.
  SternstundeApp:
    type: application
    platform: iOS
    sources:
      - Shared
      - path: Sternstunde
        excludes: [CHANGELOG.md]
      - path: ../assets/basemap/basemap.json
        buildPhase: resources
      # The star data (PLAN.md 14.2), the same file as in the Android app and the web app.
      - path: ../assets/stars/stars.json
        buildPhase: resources
    dependencies:
      - package: Almucantar
        product: Almucantar
    settings:
      base:
        PRODUCT_NAME: Sternstunde
        PRODUCT_MODULE_NAME: SternstundeApp
        PRODUCT_BUNDLE_IDENTIFIER: at.stefl.sternstunde
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [SternstundeTests]
    info:
      path: Sternstunde/Info.plist
      properties:
        CFBundleDisplayName: Sternstunde
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Sternstunde shows the stars on the camera image.
        NSLocationWhenInUseUsageDescription: Sternstunde needs your place to calculate the positions of the stars.
        NSMotionUsageDescription: Sternstunde uses the motion sensors to know where the phone points.
  # The tests of the data of sternstunde. They run in the app, because the app owns the code.
  SternstundeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SternstundeTests
      - path: ../assets/stars/stars.json
        buildPhase: resources
    dependencies:
      - target: SternstundeApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Sternstunde.app/Sternstunde"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # The store screenshots: a UI test that starts the app in its demo mode (screenshots/README.md).
  SonnseiteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SonnseiteUITests]
    dependencies:
      - target: SonnseiteApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: SonnseiteApp
        SWIFT_VERSION: "5.0"
schemes:
  # fastlane snapshot runs this scheme. The tests run in Debug, because only a debug build has the
  # demo mode.
  Sonnseite Screenshots:
    build:
      targets:
        SonnseiteApp: all
        SonnseiteUITests: [test]
    test:
      config: Debug
      targets: [SonnseiteUITests]
