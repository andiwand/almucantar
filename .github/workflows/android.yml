name: android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "core/**"
      - "assets/basemap/**"
      - "assets/stars/**"
      - ".github/workflows/android.yml"
      - ".github/workflows/native-android.yml"
  pull_request:
    paths:
      - "android/**"
      - "core/**"
      - "assets/basemap/**"
      - "assets/stars/**"
      - ".github/workflows/android.yml"
      - ".github/workflows/native-android.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    uses: ./.github/workflows/native-android.yml

  app:
    name: app (build, unit tests, lint, format)
    needs: native
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    env:
      # The native libraries come from the native job, so the AAR build does not run Conan.
      ALMUCANTAR_ABIS: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: native-android-*
          merge-multiple: true
          path: core/android/native/prebuilt/jniLibs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, test, lint, and check the format
        run: ./gradlew :shared:testDebugUnitTest :shared:lintDebug :sonnseite:assembleDebug :sonnseite:testDebugUnitTest :sonnseite:lintDebug :sternstunde:assembleDebug :sternstunde:testDebugUnitTest :sternstunde:lintDebug :alidade:assembleDebug :alidade:testDebugUnitTest :alidade:lintDebug spotlessCheck

      - uses: actions/upload-artifact@v4
        with:
          name: sonnseite-debug-apk
          path: android/sonnseite/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sternstunde-debug-apk
          path: android/sternstunde/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: alidade-debug-apk
          path: android/alidade/build/outputs/apk/debug/*.apk
