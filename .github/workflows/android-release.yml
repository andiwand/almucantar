# Builds an Android app when its release is published (sonnseite-android-v*, sternstunde-android-v*,
# or alidade-android-v*), and attaches the APK to the release. With the signing secrets of the
# app, the APK is signed for release. For Sonnseite, the secrets are:
#   SONNSEITE_KEYSTORE (base64 of the keystore), SONNSEITE_KEYSTORE_PASSWORD, SONNSEITE_KEY_ALIAS,
#   SONNSEITE_KEY_PASSWORD.
# Sternstunde and Alidade use the same names with STERNSTUNDE_ and ALIDADE_.
# Without them, the workflow attaches a debug build, named so.
name: android-release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      app:
        description: The app to build
        type: choice
        options: [sonnseite, sternstunde, alidade]
        default: sonnseite
      version:
        description: The version to build (nothing is attached)
        type: string
        default: 0.0.1

jobs:
  native:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'sonnseite-android-v') ||
      startsWith(github.event.release.tag_name, 'sternstunde-android-v') ||
      startsWith(github.event.release.tag_name, 'alidade-android-v')
    uses: ./.github/workflows/native-android.yml

  apk:
    needs: native
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    env:
      ALMUCANTAR_ABIS: ""
      TAG: ${{ github.event.release.tag_name }}
      INPUT_APP: ${{ inputs.app }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: App and version
        id: app
        run: |
          if [ -n "${TAG}" ]; then
            app="${TAG%%-android-v*}"
            version="${TAG#*-android-v}"
          else
            app="${INPUT_APP}"
            version="${INPUT_VERSION}"
          fi
          {
            echo "app=${app}"
            echo "prefix=$(echo "${app}" | tr '[:lower:]' '[:upper:]')"
            echo "version=${version}"
          } >> "${GITHUB_OUTPUT}"

      - uses: actions/download-artifact@v4
        with:
          pattern: native-android-*
          merge-multiple: true
          path: core/android/native/prebuilt/jniLibs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # The Gradle module of the app reads <APP>_VERSION and the signing variables <APP>_*.
      - name: Build
        env:
          APP: ${{ steps.app.outputs.app }}
          PREFIX: ${{ steps.app.outputs.prefix }}
          VERSION: ${{ steps.app.outputs.version }}
          KEYSTORE_BASE64: ${{ secrets[format('{0}_KEYSTORE', steps.app.outputs.prefix)] }}
          KEYSTORE_PASSWORD: ${{ secrets[format('{0}_KEYSTORE_PASSWORD', steps.app.outputs.prefix)] }}
          KEY_ALIAS: ${{ secrets[format('{0}_KEY_ALIAS', steps.app.outputs.prefix)] }}
          KEY_PASSWORD: ${{ secrets[format('{0}_KEY_PASSWORD', steps.app.outputs.prefix)] }}
        run: |
          export "${PREFIX}_VERSION=${VERSION}"
          mkdir -p out
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.keystore"
            export "${PREFIX}_KEYSTORE_FILE=${RUNNER_TEMP}/release.keystore"
            export "${PREFIX}_KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}"
            export "${PREFIX}_KEY_ALIAS=${KEY_ALIAS}"
            export "${PREFIX}_KEY_PASSWORD=${KEY_PASSWORD}"
            ./gradlew ":${APP}:assembleRelease"
            cp "${APP}/build/outputs/apk/release/${APP}-release.apk" "out/${APP}-${VERSION}.apk"
          else
            echo "::notice::No signing secrets; the release gets a debug build"
            ./gradlew ":${APP}:assembleDebug"
            cp "${APP}/build/outputs/apk/debug/${APP}-debug.apk" "out/${APP}-${VERSION}-debug.apk"
          fi

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${TAG}" out/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/out/*.apk
