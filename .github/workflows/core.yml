name: core

on:
  push:
    branches: [main]
    paths: ["core/**", "scripts/requirements-dev.txt", ".github/workflows/core.yml"]
  pull_request:
    paths: ["core/**", "scripts/requirements-dev.txt", ".github/workflows/core.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CONAN_VERSION: "2.26.1"

defaults:
  run:
    working-directory: core

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.build_type }}${{ matrix.sanitize == 'ON' && ', sanitizers' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, build_type: Debug, preset: debug, sanitize: "ON" }
          - { os: ubuntu-24.04, build_type: Release, preset: release, sanitize: "OFF" }
          - { os: macos-15, build_type: Debug, preset: debug, sanitize: "ON" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: |
          pip install "conan==${CONAN_VERSION}"
          conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          # The image version and the Conan version change the compiler and the packages.
          key: conan-${{ matrix.os }}-${{ env.ImageVersion }}-${{ env.CONAN_VERSION }}-${{ matrix.build_type }}-${{ hashFiles('core/conanfile.py') }}

      - name: Install dependencies
        run: conan install . --build=missing -s build_type=${{ matrix.build_type }} -s compiler.cppstd=20

      - name: Configure
        run: >
          cmake --preset conan-${{ matrix.preset }}
          -DSUNRADAR_WARNINGS_AS_ERRORS=ON
          -DSUNRADAR_SANITIZE=${{ matrix.sanitize }}

      - name: Build
        run: cmake --build --preset conan-${{ matrix.preset }}

      - name: Test
        run: ctest --preset conan-${{ matrix.preset }} --output-on-failure

      - name: Check the installed headers
        run: |
          cmake --install build/${{ matrix.build_type }} --prefix "${RUNNER_TEMP}/install" --component core
          if find "${RUNNER_TEMP}/install/include" -path '*internal*' | grep .; then
            echo "the install tree contains internal headers"
            exit 1
          fi

  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    env:
      # Conan and CMake must both use clang, so clang-tidy sees clang flags.
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          pip install "conan==${CONAN_VERSION}" -r ../scripts/requirements-dev.txt
          conan profile detect --force

      - name: Install dependencies
        run: >
          conan install . --build=missing -s build_type=Debug -s compiler.cppstd=20
          -o "&:with_python=True" -o "&:with_jni=True"
          -c tools.build:compiler_executables="{'c': 'clang', 'cpp': 'clang++'}"

      - name: Configure
        run: cmake --preset conan-debug -DPython_EXECUTABLE="$(which python)"

      - name: Run clang-tidy
        run: |
          git ls-files 'src/*.cpp' 'python/src/*.cpp' 'android/jni/*.cpp' |
            xargs -n 1 -P 4 clang-tidy -p build/Debug --quiet
