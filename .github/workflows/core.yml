name: core

on:
  push:
    branches: [main]
    paths: ["core/**", ".github/workflows/core.yml"]
  pull_request:
    paths: ["core/**", ".github/workflows/core.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CONAN_VERSION: "2.26.1"

defaults:
  run:
    working-directory: core

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.build_type }}${{ matrix.sanitize == 'ON' && ', sanitizers' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, build_type: Debug, preset: debug, sanitize: "ON" }
          - { os: ubuntu-24.04, build_type: Release, preset: release, sanitize: "OFF" }
          - { os: macos-15, build_type: Debug, preset: debug, sanitize: "ON" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: |
          pip install "conan==${CONAN_VERSION}"
          conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ matrix.os }}-${{ matrix.build_type }}-${{ hashFiles('core/conanfile.py') }}

      - name: Install dependencies
        run: conan install . --build=missing -s build_type=${{ matrix.build_type }} -s compiler.cppstd=20

      - name: Configure
        run: >
          cmake --preset conan-${{ matrix.preset }}
          -DSUNRADAR_WARNINGS_AS_ERRORS=ON
          -DSUNRADAR_SANITIZE=${{ matrix.sanitize }}

      - name: Build
        run: cmake --build --preset conan-${{ matrix.preset }}

      - name: Test
        run: ctest --preset conan-${{ matrix.preset }} --output-on-failure

      - name: Check the installed headers
        run: |
          cmake --install build/${{ matrix.build_type }} --prefix "${RUNNER_TEMP}/install" --component core
          if find "${RUNNER_TEMP}/install/include" -path '*internal*' | grep .; then
            echo "the install tree contains internal headers"
            exit 1
          fi

  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          pip install "conan==${CONAN_VERSION}" -r ../scripts/requirements-dev.txt
          CC=clang CXX=clang++ conan profile detect --force

      - name: Install dependencies
        run: conan install . --build=missing -s build_type=Debug -s compiler.cppstd=20 -o "&:with_python=True"

      - name: Configure
        run: cmake --preset conan-debug -DPython_EXECUTABLE="$(which python)"

      - name: Run clang-tidy
        run: |
          git ls-files 'src/*.cpp' 'python/src/*.cpp' | xargs -n 1 -P 4 clang-tidy -p build/Debug --quiet

  android:
    name: build (android, ${{ matrix.abi }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [armv8, x86_64]
    env:
      NDK_VERSION: "28.2.13676358"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: |
          pip install "conan==${CONAN_VERSION}"
          conan profile detect --force

      - name: Install the NDK
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Install dependencies
        run: >
          conan install . --build=missing
          -pr:h conan/profiles/android-${{ matrix.abi }} -pr:b default
          -o "&:with_tests=False"

      - name: Configure
        run: cmake --preset conan-android-${{ matrix.abi }}-release -DSUNRADAR_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset conan-android-${{ matrix.abi }}-release
