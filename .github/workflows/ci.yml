name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CONAN_VERSION: "2.26.1"

defaults:
  run:
    working-directory: core

jobs:
  core:
    name: core (${{ matrix.os }}, ${{ matrix.build_type }}${{ matrix.sanitize == 'ON' && ', sanitizers' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, build_type: Debug, sanitize: "ON" }
          - { os: ubuntu-24.04, build_type: Release, sanitize: "OFF" }
          - { os: macos-15, build_type: Debug, sanitize: "ON" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: |
          pip install "conan==${CONAN_VERSION}"
          conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ matrix.os }}-${{ matrix.build_type }}-${{ hashFiles('core/conanfile.py') }}

      - name: Install dependencies
        run: conan install . --build=missing -s build_type=${{ matrix.build_type }} -s compiler.cppstd=20

      - name: Configure
        run: >
          cmake --preset conan-${{ matrix.build_type == 'Debug' && 'debug' || 'release' }}
          -DSUNRADAR_WARNINGS_AS_ERRORS=ON
          -DSUNRADAR_SANITIZE=${{ matrix.sanitize }}

      - name: Build
        run: cmake --build --preset conan-${{ matrix.build_type == 'Debug' && 'debug' || 'release' }}

      - name: Test
        run: ctest --preset conan-${{ matrix.build_type == 'Debug' && 'debug' || 'release' }} --output-on-failure

  android:
    name: core (android, ${{ matrix.abi }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [armv8, x86_64]
    env:
      NDK_VERSION: "28.2.13676358"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: |
          pip install "conan==${CONAN_VERSION}"
          conan profile detect --force

      - name: Install the NDK
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Install dependencies
        run: >
          conan install . --build=missing
          -pr:h conan/profiles/android-${{ matrix.abi }} -pr:b default
          -o "&:with_tests=False"

      - name: Configure
        run: cmake --preset conan-android-${{ matrix.abi }}-release -DSUNRADAR_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset conan-android-${{ matrix.abi }}-release
