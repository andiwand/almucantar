# The store screenshots (screenshots/README.md): one capture job for each device, a job that checks
# the complete set of each platform, and an upload to the store if `upload` is set.
#
# The input `app` chooses the app (sonnseite, sternstunde, or alidade). iOS has screenshots of
# Sonnseite only, so the iOS jobs run only for it.
#
# The upload needs credentials. Without them, the upload job writes a notice and stops:
# - Google Play: the secret SUPPLY_JSON_KEY_DATA or GOOGLE_PLAY_JSON_KEY, the JSON key of a service
#   account with the permission "Manage store presence" in the Play Console.
# - App Store Connect: the secrets ASC_KEY_ID, ASC_ISSUER_ID, and ASC_KEY_CONTENT (the .p8 key,
#   base64-encoded) of an App Store Connect API key with the role App Manager.
name: screenshots

on:
  workflow_dispatch:
    inputs:
      app:
        description: The app
        type: choice
        options: [sonnseite, sternstunde, alidade]
        default: sonnseite
      platform:
        description: The platform
        type: choice
        options: [all, android, ios]
        default: all
      upload:
        description: Upload the screenshots to the store
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.app }}
  cancel-in-progress: true

env:
  CONAN_VERSION: "2.26.1"
  APP: ${{ inputs.app }}
  # The folders of fastlane for the app: Sonnseite has the folders themselves, each other app a
  # folder below them (store.fastlane_dir in scripts/screenshots/store.py).
  APP_DIR: ${{ inputs.app != 'sonnseite' && format('/{0}', inputs.app) || '' }}

jobs:
  native:
    if: inputs.platform != 'ios'
    uses: ./.github/workflows/native-android.yml

  android:
    name: android (${{ matrix.device }})
    if: inputs.platform != 'ios'
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        device: [phone, tablet]
    env:
      ALMUCANTAR_ABIS: ""
      SONNSEITE_SCREENSHOT_DEVICE: ${{ matrix.device }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: native-android-*
          merge-multiple: true
          path: core/android/native/prebuilt/jniLibs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Install Pillow
        run: |
          python3 -m venv .venv
          .venv/bin/pip install "$(grep -i '^pillow==' scripts/requirements-dev.txt)"

      # The newest device profile of the runner. The phone set is a Pixel Pro, the tablet set the
      # Pixel Tablet.
      - name: Pick the device profile
        id: avd
        run: |
          if [ "${SONNSEITE_SCREENSHOT_DEVICE}" = tablet ]; then
            candidates="pixel_tablet pixel_c"
          else
            candidates="pixel_9_pro_xl pixel_8_pro pixel_7_pro pixel_6_pro"
          fi
          known="$("${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager" list device -c)"
          for profile in ${candidates}; do
            if grep -qx "${profile}" <<< "${known}"; then
              echo "profile=${profile}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          done
          echo "::error::The runner has none of the device profiles ${candidates}"
          exit 1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture and frame
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: ${{ steps.avd.outputs.profile }}
          # All 4 cores of the runner: the searches of Alidade use all threads, and with 2 cores
          # the emulator stopped answering adb ("device offline").
          cores: 4
          ram-size: 6144M
          disable-animations: true
          # The speed of LTE: Alidade downloads the terrain tiles at the second screen, and at the
          # full speed of the runner the emulator stopped answering adb ("device offline").
          emulator-options: -no-snapshot-save -no-snapshot-load -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics -netspeed lte
          working-directory: android
          # The memory and the kernel log of the emulator, every 2 seconds, into files outside the
          # emulator: if the emulator stops, they show its last state.
          script: |
            nohup sh -c 'while true; do adb shell "date; head -4 /proc/meminfo; top -b -n 1 -m 6 -o PID,RES,%CPU,ARGS"; sleep 2; done' > emulator-monitor.txt 2>&1 &
            nohup adb logcat -b kernel > emulator-kernel.txt 2>&1 &
            bundle exec fastlane screenshots "app:${APP}"

      - uses: actions/upload-artifact@v4
        with:
          name: framed-android-${{ matrix.device }}
          path: android/fastlane/framed${{ env.APP_DIR }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-android-${{ matrix.device }}
          path: android/fastlane/screenshots${{ env.APP_DIR }}
          if-no-files-found: ignore

      # If the emulator went away: did the host kill it, and how much memory was free?
      - name: Show the state of the runner
        if: failure()
        run: |
          free -m
          sudo dmesg | tail -n 60

      # The report and the logcat of a failed test (AGP writes the logcat into the test results).
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-android-${{ matrix.device }}
          path: |
            android/*/build/reports/androidTests
            android/*/build/outputs/androidTest-results
            android/emulator-*.txt
          if-no-files-found: ignore

  ios:
    name: ios (${{ matrix.device }})
    if: inputs.platform != 'android' && inputs.app == 'sonnseite'
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        device: [iphone, ipad]
    env:
      SONNSEITE_SCREENSHOT_DEVICE: ${{ matrix.device }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan, XcodeGen, and Pillow
        run: |
          pip install "conan==${CONAN_VERSION}"
          conan profile detect --force
          brew install xcodegen
          python3 -m venv .venv
          .venv/bin/pip install "$(grep -i '^pillow==' scripts/requirements-dev.txt)"

      - name: Build the xcframework
        run: python3 core/apple/build_xcframework.py

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Capture and frame
        working-directory: ios
        run: bundle exec fastlane screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: framed-ios-${{ matrix.device }}
          path: ios/fastlane/framed

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-ios-${{ matrix.device }}
          path: |
            ios/fastlane/screenshots
            ~/Library/Logs/snapshot
          if-no-files-found: ignore

  # The complete set of a platform: the framed images of all devices together, checked.
  set:
    name: set (${{ matrix.platform }})
    needs: [android, ios]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]
    steps:
      - uses: actions/checkout@v4
        if: (inputs.platform == 'all' || inputs.platform == matrix.platform) && (matrix.platform == 'android' || inputs.app == 'sonnseite')

      - uses: actions/download-artifact@v4
        if: (inputs.platform == 'all' || inputs.platform == matrix.platform) && (matrix.platform == 'android' || inputs.app == 'sonnseite')
        with:
          pattern: framed-${{ matrix.platform }}-*
          merge-multiple: true
          path: ${{ matrix.platform }}/fastlane/framed${{ env.APP_DIR }}

      - name: Check the set
        if: (inputs.platform == 'all' || inputs.platform == matrix.platform) && (matrix.platform == 'android' || inputs.app == 'sonnseite')
        run: python3 scripts/screenshots/store.py --platform ${{ matrix.platform }} --app "${APP}" --screenshots ${{ matrix.platform }}/fastlane/framed${{ env.APP_DIR }}

      - uses: actions/upload-artifact@v4
        if: (inputs.platform == 'all' || inputs.platform == matrix.platform) && (matrix.platform == 'android' || inputs.app == 'sonnseite')
        with:
          name: framed-${{ matrix.platform }}
          path: ${{ matrix.platform }}/fastlane/framed${{ env.APP_DIR }}

  # A skipped job before `set` (the other platform) skips the jobs after it, unless the condition
  # checks the result of `set` itself.
  upload-android:
    name: upload (Google Play)
    needs: set
    if: ${{ !cancelled() && needs.set.result == 'success' && inputs.upload && inputs.platform != 'ios' }}
    runs-on: ubuntu-24.04
    env:
      SUPPLY_JSON_KEY_DATA: ${{ secrets.SUPPLY_JSON_KEY_DATA || secrets.GOOGLE_PLAY_JSON_KEY }}
    steps:
      - name: Check the credentials
        id: credentials
        run: |
          if [ -z "${SUPPLY_JSON_KEY_DATA}" ]; then
            echo "::notice::No SUPPLY_JSON_KEY_DATA: the upload to Google Play is skipped."
            echo "present=false" >> "${GITHUB_OUTPUT}"
          else
            echo "present=true" >> "${GITHUB_OUTPUT}"
          fi

      - uses: actions/checkout@v4
        if: steps.credentials.outputs.present == 'true'

      - uses: actions/download-artifact@v4
        if: steps.credentials.outputs.present == 'true'
        with:
          name: framed-android
          path: android/fastlane/framed${{ env.APP_DIR }}

      - uses: ruby/setup-ruby@v1
        if: steps.credentials.outputs.present == 'true'
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Upload
        if: steps.credentials.outputs.present == 'true'
        working-directory: android
        run: bundle exec fastlane upload_listing "app:${APP}"

  upload-ios:
    name: upload (App Store)
    needs: set
    if: ${{ !cancelled() && needs.set.result == 'success' && inputs.upload && inputs.platform != 'android' && inputs.app == 'sonnseite' }}
    runs-on: macos-15
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
    steps:
      - name: Check the credentials
        id: credentials
        run: |
          if [ -z "${ASC_KEY_ID}" ] || [ -z "${ASC_ISSUER_ID}" ] || [ -z "${ASC_KEY_CONTENT}" ]; then
            echo "::notice::No App Store Connect API key: the upload to the App Store is skipped."
            echo "present=false" >> "${GITHUB_OUTPUT}"
          else
            echo "present=true" >> "${GITHUB_OUTPUT}"
          fi

      - uses: actions/checkout@v4
        if: steps.credentials.outputs.present == 'true'

      - uses: actions/download-artifact@v4
        if: steps.credentials.outputs.present == 'true'
        with:
          name: framed-ios
          path: ios/fastlane/framed

      - uses: ruby/setup-ruby@v1
        if: steps.credentials.outputs.present == 'true'
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Upload
        if: steps.credentials.outputs.present == 'true'
        working-directory: ios
        run: bundle exec fastlane upload_listing "app:${APP}"
