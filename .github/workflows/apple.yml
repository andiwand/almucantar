# The Apple part: the xcframework of the C API, the tests of the Swift package, and the builds and
# tests of the iOS apps for the simulator (without signing).
name: apple

on:
  push:
    branches: [main]
    paths: ["core/**", "ios/**", "assets/basemap/**", "assets/stars/**", "assets/tzdata/**", "Package.swift", ".github/workflows/apple.yml"]
  pull_request:
    paths: ["core/**", "ios/**", "assets/basemap/**", "assets/stars/**", "assets/tzdata/**", "Package.swift", ".github/workflows/apple.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CONAN_VERSION: "2.26.1"

jobs:
  swift:
    name: xcframework, swift test, iOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan and XcodeGen
        run: |
          pip install "conan==${CONAN_VERSION}"
          conan profile detect --force
          brew install xcodegen

      - name: Build the xcframework
        run: python3 core/apple/build_xcframework.py

      - name: Test the Swift package
        run: swift test

      - name: Build and test the iOS apps
        working-directory: ios
        run: |
          xcodegen generate
          device="$(xcrun simctl list devices available -j | python3 -c 'import json, sys
          print(next(d["udid"] for r, ds in json.load(sys.stdin)["devices"].items() if "iOS" in r for d in ds if "iPhone" in d["name"]))')"
          # The framework builds the shared code alone, so it fails if the shared code uses an app.
          xcodebuild -project Almucantar.xcodeproj -scheme AlmucantarShared \
            -destination "id=${device}" -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO test
          xcodebuild -project Almucantar.xcodeproj -scheme SonnseiteApp \
            -destination "id=${device}" -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO build
          # The scheme of sternstunde builds the app and runs its tests in it.
          xcodebuild -project Almucantar.xcodeproj -scheme SternstundeApp \
            -destination "id=${device}" -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO test
