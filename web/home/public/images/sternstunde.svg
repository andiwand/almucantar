<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">Sternstunde</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1430"/>
      <stop offset="1" stop-color="#050916"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cfe3ff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#cfe3ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#sky)"/>
  <!-- the horizon with ticks, as in the logo of sonnseite -->
  <path d="M64 372 H448" stroke="#ffffff" stroke-opacity="0.85" stroke-width="10" stroke-linecap="round"/>
  <path d="M136 372 v-16 M256 372 v-24 M376 372 v-16" stroke="#ffffff" stroke-opacity="0.85" stroke-width="8" stroke-linecap="round"/>
  <!-- a constellation: the lines and the stars -->
  <path d="M112 300 L170 236 L256 210 L330 150 L404 176 M256 210 L300 290" fill="none" stroke="#8fb4ff" stroke-opacity="0.7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#e8f0ff">
    <circle cx="112" cy="300" r="10"/>
    <circle cx="170" cy="236" r="12"/>
    <circle cx="330" cy="150" r="13"/>
    <circle cx="404" cy="176" r="9"/>
    <circle cx="300" cy="290" r="10"/>
  </g>
  <!-- the brightest star, with a crosshair -->
  <circle cx="256" cy="210" r="70" fill="url(#glow)"/>
  <circle cx="256" cy="210" r="22" fill="#ffffff"/>
  <path d="M256 140 v26 M256 254 v26 M186 210 h26 M300 210 h26" stroke="#7fd8ff" stroke-width="9" stroke-linecap="round"/>
</svg>
