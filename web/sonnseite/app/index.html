<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1a30" />
    <title>Sonnseite</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <video id="camera" playsinline muted></video>
    <canvas id="sky" role="img" aria-label="The sky with the path of the sun"></canvas>
    <div id="status" class="panel"></div>
    <div id="message" class="panel hidden"></div>
    <div id="bottom">
      <div id="time-panel" class="panel hidden">
        <label class="field">
          <span class="field-head"><span>Date</span><span id="date-label"></span></span>
          <input id="date-offset" type="range" min="-183" max="183" value="0" />
        </label>
        <label class="field">
          <span class="field-head"><span>Time</span><span id="time-label"></span></span>
          <input id="minute" type="range" min="0" max="1439" value="720" />
        </label>
        <label id="fov-row" class="field hidden">
          <span class="field-head"><span>Field of view</span><span id="fov-label"></span></span>
          <input id="fov" type="range" min="40" max="100" value="65" />
        </label>
        <div class="panel-row">
          <button id="now">Now</button>
          <label class="check"><input id="terrain-on" type="checkbox" /> Terrain horizon</label>
        </div>
        <p class="credits">
          Terrain:
          <a href="https://registry.opendata.aws/terrain-tiles/" target="_blank" rel="noopener"
            >Terrain Tiles on AWS</a
          >
          (<a
            href="https://github.com/tilezen/joerd/blob/master/docs/attribution.md"
            target="_blank"
            rel="noopener"
            >sources and attribution</a
          >)
        </p>
      </div>
      <div id="readout" class="panel"></div>
      <div id="buttons">
        <button id="start" class="primary">Start sensors</button>
        <button id="camera-button">Camera</button>
        <button id="time-button">Time</button>
        <button id="place-button">Place</button>
        <button id="align-button">Align with the sun</button>
      </div>
    </div>
    <div id="place-panel" class="hidden" role="dialog" aria-label="Place">
      <canvas id="place-map" aria-label="The map: tap to drop the place"></canvas>
      <div class="place-top">
        <div class="search-bar">
          <button id="place-close" class="icon" aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" /></svg>
          </button>
          <input id="place-search" type="search" placeholder="Search a place" autocomplete="off" />
          <button id="place-clear" class="icon hidden" aria-label="Clear">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </div>
        <div id="place-results" class="hidden"></div>
      </div>
      <div class="place-bottom">
        <div class="map-buttons">
          <button id="place-zoom-in" class="round" aria-label="Zoom in">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14" /></svg>
          </button>
          <button id="place-zoom-out" class="round" aria-label="Zoom out">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /></svg>
          </button>
          <button id="place-here" class="round" aria-label="Use my location">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="6" />
              <circle cx="12" cy="12" r="2.5" class="fill" />
              <path d="M12 2v3M12 19v3M2 12h3M19 12h3" />
            </svg>
          </button>
        </div>
        <div class="place-card">
          <div id="place-title" class="title"></div>
          <div id="place-subtitle" class="muted"></div>
          <div class="hint">Tap the map to move the place, or search for it.</div>
          <hr />
          <div class="keep-row">
            <button id="place-keep" class="tonal">Keep offline</button>
            <span id="place-keep-status" class="muted">
              Keep the terrain of this place for a trip without a network.
            </span>
          </div>
          <div id="place-kept"></div>
          <div class="attribution">Map: Natural Earth (public domain)</div>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
