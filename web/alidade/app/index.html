<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3ece1" />
    <title>Alidade</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header id="bar">
      <button id="back" class="icon" aria-label="Back">←</button>
      <button id="home" class="brand" aria-label="Start">
        <img src="./icon.svg" alt="" width="28" height="28" />
        <span>Alidade</span>
      </button>
      <ol id="trail" aria-label="The steps"></ol>
    </header>

    <main id="page"></main>

    <section id="map-screen" class="hidden" aria-label="The map">
      <canvas id="map" role="img" aria-label="The map of the terrain"></canvas>
      <div id="map-search">
        <input id="search" type="search" placeholder="Search a place" autocomplete="off" />
        <div id="results" class="hidden"></div>
      </div>
      <div id="map-card" class="card"></div>
    </section>

    <noscript><p class="card">Alidade needs JavaScript.</p></noscript>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
